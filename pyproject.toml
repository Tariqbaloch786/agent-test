[tool.poetry]
name = "assistant"
version = "0.1.0"
description = "A small assistant service on the openai Python SDK (a demo repository for API Update Agent)."
authors = ["API Update Agent demo <demo@example.invalid>"]
license = "MIT"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
openai = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
mypy = "^1.13"
pytest-github-actions-annotate-failures = "^0.3"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
